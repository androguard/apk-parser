name: Tests

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get -y install --no-install-recommends libmagic1 libmagic-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python package and test deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest
          python3 -m pip install .

      - name: Run unittest
        run: python3 -m unittest discover -s tests -v

      - name: Build sdist/wheel
        run: |
          python3 -m pip install build
          python3 -m build

  python-ubuntu-22-04:
    name: Python 3.10 (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get -y install --no-install-recommends \
            python3 \
            python3-pip \
            python3-venv \
            python3-setuptools \
            libmagic1 \
            libmagic-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install package
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest
          python3 -m pip install .

      - name: Run unittest
        run: python3 -m unittest discover -s tests -v

  rust:
    name: Rust (apkparser-rs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        working-directory: apkparser-rs
        run: cargo test
