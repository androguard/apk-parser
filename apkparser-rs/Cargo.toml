[package]
name = "apkparser"
version = "0.1.0"
edition = "2021"
description = "APK parser - Rust port of apkparser (signature, zip, utils, permissions, manifest)"

[[bin]]
name = "apkparser"
path = "src/main.rs"

[dependencies]
byteorder = "1.5"
thiserror = "1.0"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
x509-parser = "0.16"
der = "0.7"
pkcs7 = "0.4"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axmldecoder = "0.2"
log = "0.4"
clap = { version = "4.4", features = ["derive"] }
hex = "0.4"
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["signing"] }
rand = "0.8"

# Debug key generation (rcgen → ring) is native-only; WASM uses an embedded key.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rcgen = "0.13"

[dev-dependencies]
hex = "0.4"
md5 = "0.7"
sha1 = "0.10"
sha2 = "0.10"
